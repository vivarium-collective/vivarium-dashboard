name: Build and Push Image

# Builds the vivarium-workbench server image (linux/amd64, for the EKS nodes) and
# pushes it to ghcr.io.
#
# Since #932 the image contains only the workbench and its own locked
# dependencies -- no workspace package, no science stack. That removed the two
# things that made this workflow unusable:
#
#   * It no longer copies a venv out of a per-commit sms-ecoli/v2ecoli image, so
#     there is nothing to pull from GovCloud ECR -- for which this runner has no
#     credential (no OIDC federation from GitHub Actions into that account
#     exists, and building one is real, separate infra work). The
#     `workspace_image` input is therefore GONE, not merely optional.
#   * The build no longer imports v2ecoli -> polars, so it does not need AVX and
#     is not tied to a native amd64 runner for correctness (it still runs on one,
#     which is simply faster than emulation).
#
# Release-triggering is still deliberately absent. v0.3.38 shipped a real,
# confirmed-broken tag+Release from an automatic run; cutting a Release here is
# documentation, and the image is published by this manual dispatch (or by
# `deploy/build-and-push.sh`, the same command this workflow runs).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to build+push (default: git short sha)"
        required: false
        default: ""
      pbg_ptools_ref:
        description: "git ref for the pbg-ptools Omics-Viewer plugin (default: main)"
        required: false
        default: "main"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    steps:
      # Kept but no longer critical: the image is ~744 MB since #932 (was ~15 GB).
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Reuse the org GHCR_PAT (as sms-api does); fall back to GITHUB_TOKEN.
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build + push (linux/amd64)
        env:
          PBG_PTOOLS_REF: ${{ inputs.pbg_ptools_ref }}
        run: |
          set -euo pipefail
          chmod +x deploy/build-and-push.sh
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"   # strip a leading v -> matches sms-api newTag (e.g. 0.1.0)
          deploy/build-and-push.sh "$VERSION"
